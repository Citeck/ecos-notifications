---
id: retry-notification-action
name:
  ru: Повторить отправку сейчас
  en: Retry now
icon: icon-reload
confirm:
  title:
    ru: Подтвердите действие
    en: Confirm the action
  message:
    ru: Вернуть уведомление в очередь повторных отправок, не дожидаясь запланированного времени
    en: Put the notification back into the retry pipeline without waiting for the scheduled time
type: mutate
config:
  record:
    attributes:
      action: RETRY
evaluator:
  id: null
  type: predicate
  inverse: false
  config:
    predicate:
      t: in
      att: state
      val:
        - ERROR
        - FAILED
        - EXPIRED
