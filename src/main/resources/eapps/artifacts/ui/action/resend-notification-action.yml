---
id: resend-notification-action
name:
  ru: Отправить повторно
  en: Resend
icon: icon-redo
confirm:
  title:
    ru: Подтвердите действие
    en: Confirm the action
  message:
    ru: Отправить повторно
    en: Resend
type: mutate
config:
  record:
    attributes:
      action: RESEND
evaluator:
  id: null
  type: predicate
  inverse: false
  config:
    predicate:
      t: and
      val:
        - t: empty
          att: bulkMailRef
        - t: empty
          att: delayedSend
        # failed rows are re-driven through retry-notification-action instead:
        # it reuses the existing row, while RESEND creates a brand new notification
        - t: not
          val:
            t: in
            att: state
            val:
              - ERROR
              - FAILED
              - EXPIRED
