
ecos:
  webapp:
    dataSources:
      main:
        url: jdbc:postgresql://localhost:14523/ecos_notifications
        username: notifications
        password: notificationspassword
      main-xa-aware:
        url: ${ecos.webapp.dataSources.main.url}
        username: ${ecos.webapp.dataSources.main.username}
        password: ${ecos.webapp.dataSources.main.password}
        xa: true
  x509:
    keys:
      application:
        location: classpath:ecos/x509/keys/application.key

management:
  health:
    mail:
      enabled: false

spring:
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          # finite timeouts are required by the retry lease invariant:
          # retry.lease-time > retry.batch-size * SMTP timeout
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          # deliver to the accepted recipients instead of aborting the whole message when some
          # of them are rejected. Required by PartialDeliveryDetector: JavaMail only reports
          # SendFailedException.validSentAddresses when this is enabled
          sendpartial: true
  task:
    scheduling:
      pool:
        # a retry tick may occupy its thread for the whole SMTP batch, the delayed-notification
        # dispatcher and the bulk mail status sync must not wait behind it
        size: 4

server:
  port: 8013

ecos-notifications:
  event:
    enabled: false
  retry:
    enabled: true
    poll-interval: 30s
    batch-size: 50
    max-attempts: 20
    initial-interval: 1m
    multiplier: 3.0
    max-interval: 2h
    retry-window: 24h
    # lease must exceed batch-size * worst-case send timeout (50 * 10s ~= 8.3m)
    lease-time: 15m
  awaiting-dispatch:
    delay: 15000
    batch-size: 1000
  bulk-mail:
    sync-status-delay: 7000
  startup-notification:
    enabled: true
    body: Microservice ecos-notifications successfully started and ready for operation. This is a test message – no reply is needed.
    title: Microservice ecos-notifications successfully started and ready for operation
    recipient: test@test.ru

notifications:
  default:
    locale: ru
